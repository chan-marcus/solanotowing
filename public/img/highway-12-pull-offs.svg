<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Where to pull off on Highway 12 between Suisun City and Rio Vista: the Grizzly Island Road junction, Birds Landing Road, Shiloh Road, Collinsville Road, Church Road and the Highway 113 junction at Rio Vista, with long stretches of levee and farmland between them where the shoulder narrows to almost nothing">
  <rect width="720" height="330" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">Highway 12: where you can actually get off</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Eastbound from Suisun City out to the Rio Vista bridge</text>

  <g>
    <path d="M56 150 h608" stroke="#22344b" stroke-width="26" stroke-linecap="round"/>
    <path d="M56 150 h608" stroke="#e8a33d" stroke-width="2" stroke-dasharray="16 14" stroke-opacity="0.75"/>
    <g font-family="Arial, sans-serif" font-size="11.5" fill="#dfe3ee">
      <circle cx="86" cy="150" r="7" fill="#e8a33d"/>
      <text x="86" y="128" text-anchor="middle" fill="#f6f2ea" font-size="12.5">Suisun City</text>
      <text x="86" y="182" text-anchor="middle" fill="#94a3b8">services, fuel</text>

      <circle cx="214" cy="150" r="6" fill="#56d364"/>
      <text x="214" y="128" text-anchor="middle">Grizzly Island Rd</text>
      <text x="214" y="182" text-anchor="middle" fill="#94a3b8">last easy pull off</text>

      <circle cx="330" cy="150" r="6" fill="#56d364"/>
      <text x="330" y="128" text-anchor="middle">Birds Landing Rd</text>

      <circle cx="430" cy="150" r="6" fill="#56d364"/>
      <text x="430" y="128" text-anchor="middle">Shiloh Rd</text>

      <circle cx="516" cy="150" r="6" fill="#56d364"/>
      <text x="516" y="182" text-anchor="middle">Collinsville Rd</text>

      <circle cx="600" cy="150" r="6" fill="#56d364"/>
      <text x="600" y="128" text-anchor="middle">Church Rd</text>

      <circle cx="664" cy="150" r="7" fill="#e8a33d"/>
      <text x="664" y="182" text-anchor="middle" fill="#f6f2ea" font-size="12.5">Rio Vista</text>
    </g>
    <path d="M240 206 h66" stroke="#f0705a" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
    <text x="330" y="210" font-family="Arial, sans-serif" font-size="11.5" fill="#f0705a" text-anchor="middle">levee: almost no shoulder</text>
    <path d="M354 206 h66" stroke="#f0705a" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="26" y="236" width="330" height="70" rx="14" fill="#17263a" stroke="#e8a33d" stroke-opacity="0.45"/>
    <text x="48" y="260" font-size="13" fill="#e8a33d" font-weight="bold">Tell dispatch</text>
    <g font-size="12" fill="#dfe3ee">
      <text x="48" y="282">Direction, then the last cross road you passed</text>
      <text x="48" y="298">A mile marker paddle, or send a dropped pin</text>
    </g>

    <rect x="364" y="236" width="330" height="70" rx="14" fill="#17263a" stroke="#56d364" stroke-opacity="0.45"/>
    <text x="386" y="260" font-size="13" fill="#56d364" font-weight="bold">While you wait</text>
    <g font-size="12" fill="#dfe3ee">
      <text x="386" y="282">Stay belted inside with the hazards going</text>
      <text x="386" y="298">There is nowhere safe to stand out here</text>
    </g>
  </g>
</svg>
