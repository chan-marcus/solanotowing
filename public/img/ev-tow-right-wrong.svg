<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Comparison of EV towing methods: a flatbed with all four wheels off the ground is the manufacturer-approved method, while a wheel-lift or tow dolly leaves drive wheels spinning, which can back-feed the motor and damage the drive unit">
  <rect width="720" height="300" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">How an EV has to be towed</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">On an electric car the wheels are geared straight to the motor</text>
  <g font-family="Arial, sans-serif">
    <rect x="30" y="86" width="316" height="190" rx="14" fill="#17263a" stroke="#56d364" stroke-opacity="0.5"/>
    <circle cx="56" cy="114" r="9" fill="#56d364" fill-opacity="0.18" stroke="#56d364"/>
    <path d="M51.5 114 l3.2 3.4 l6-6.6" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="119" font-size="14.5" fill="#f6f2ea" font-weight="bold">Flatbed: all four wheels up</text>
    <!-- flatbed drawing -->
    <rect x="60" y="176" width="240" height="10" rx="2" fill="#3a5068"/>
    <path d="M110 176 L124 158 L214 156 L236 172 L250 176 Z" fill="#31394b" stroke="#454e63" stroke-width="2"/>
    <circle cx="136" cy="176" r="8" fill="#0e1119" stroke="#56d364" stroke-width="2.5"/>
    <circle cx="222" cy="176" r="8" fill="#0e1119" stroke="#56d364" stroke-width="2.5"/>
    <circle cx="90" cy="194" r="10" fill="#0e1119" stroke="#5a6580" stroke-width="3"/>
    <circle cx="276" cy="194" r="10" fill="#0e1119" stroke="#5a6580" stroke-width="3"/>
    <g font-size="12.5" fill="#dfe3ee">
      <text x="52" y="232">No wheel turns in transit</text>
      <text x="52" y="254">Required by Tesla, Rivian and most EV makers</text>
    </g>

    <rect x="374" y="86" width="316" height="190" rx="14" fill="#17263a" stroke="#f0705a" stroke-opacity="0.55"/>
    <circle cx="400" cy="114" r="9" fill="#f0705a" fill-opacity="0.18" stroke="#f0705a"/>
    <path d="M396.5 110.5 l7 7 M403.5 110.5 l-7 7" stroke="#f0705a" stroke-width="2" stroke-linecap="round"/>
    <text x="420" y="119" font-size="14.5" fill="#f6f2ea" font-weight="bold">Wheel-lift or dolly</text>
    <!-- wheel lift drawing -->
    <line x1="404" y1="190" x2="650" y2="190" stroke="#2a3446" stroke-width="2"/>
    <path d="M470 170 L484 150 L574 146 L600 164 L620 176 L470 182 Z" fill="#31394b" stroke="#454e63" stroke-width="2" transform="rotate(-6 540 165)"/>
    <circle cx="498" cy="184" r="9" fill="#0e1119" stroke="#f0705a" stroke-width="3"/>
    <circle cx="592" cy="172" r="8" fill="#0e1119" stroke="#5a6580" stroke-width="2.5"/>
    <path d="M488 202 a12 12 0 1 1 20 0" fill="none" stroke="#f0705a" stroke-width="2" stroke-dasharray="3 3"/>
    <g font-size="12.5" fill="#dfe3ee">
      <text x="396" y="232">Drive wheels spin on the road</text>
      <text x="396" y="254" fill="#f0a868">Can back-feed and damage the motor</text>
    </g>
  </g>
</svg>
