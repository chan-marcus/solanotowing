<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="Three steps after a car is towed from private property in California: find which yard has it by calling the local police non-emergency line, ask for the itemized invoice and the tow authorization, then move the vehicle out the same day to stop daily storage fees">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8a33d"/>
    </marker>
  </defs>
  <rect width="720" height="260" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">Towed from a lot or apartment? Do this</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Every day it sits is another day of storage on the bill</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="88" width="196" height="132" rx="14" fill="#17263a" stroke="rgba(255,255,255,0.12)"/>
    <text x="128" y="116" text-anchor="middle" font-size="11" letter-spacing="2" fill="#e8a33d" font-weight="bold">STEP 1</text>
    <text x="128" y="142" text-anchor="middle" font-size="15" fill="#f6f2ea" font-weight="bold">Find the yard</text>
    <text x="128" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">Call the local police</text>
    <text x="128" y="184" text-anchor="middle" font-size="12" fill="#94a3b8">non-emergency line &#8212; tows</text>
    <text x="128" y="202" text-anchor="middle" font-size="12" fill="#94a3b8">must be reported to them</text>

    <line x1="226" y1="154" x2="256" y2="154" stroke="#e8a33d" stroke-width="2.5" marker-end="url(#pa)"/>

    <rect x="262" y="88" width="196" height="132" rx="14" fill="#17263a" stroke="rgba(255,255,255,0.12)"/>
    <text x="360" y="116" text-anchor="middle" font-size="11" letter-spacing="2" fill="#e8a33d" font-weight="bold">STEP 2</text>
    <text x="360" y="142" text-anchor="middle" font-size="15" fill="#f6f2ea" font-weight="bold">Ask for paperwork</text>
    <text x="360" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">Itemized invoice and the</text>
    <text x="360" y="184" text-anchor="middle" font-size="12" fill="#94a3b8">tow authorization. Yards</text>
    <text x="360" y="202" text-anchor="middle" font-size="12" fill="#94a3b8">must take credit cards.</text>

    <line x1="458" y1="154" x2="488" y2="154" stroke="#e8a33d" stroke-width="2.5" marker-end="url(#pa)"/>

    <rect x="494" y="88" width="196" height="132" rx="14" fill="#17263a" stroke="#e8a33d"/>
    <text x="592" y="116" text-anchor="middle" font-size="11" letter-spacing="2" fill="#e8a33d" font-weight="bold">STEP 3</text>
    <text x="592" y="142" text-anchor="middle" font-size="15" fill="#f6f2ea" font-weight="bold">Move it out today</text>
    <text x="592" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">To your shop or driveway.</text>
    <text x="592" y="184" text-anchor="middle" font-size="12" fill="#56d364">Stops the storage clock</text>
    <text x="592" y="202" text-anchor="middle" font-size="12" fill="#56d364">the same day.</text>
  </g>
</svg>
