<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Night view of the I-80, I-680 and Highway 12 interchange at the Cordelia Junction, with a stalled car on the shoulder">
  <defs>
    <linearGradient id="cjSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16273c"/>
      <stop offset="0.58" stop-color="#132033"/>
      <stop offset="1" stop-color="#0d1826"/>
    </linearGradient>
    <linearGradient id="cjGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cjRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22344b"/>
      <stop offset="1" stop-color="#101c2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#cjSky)"/>
  <ellipse cx="600" cy="250" rx="560" ry="120" fill="url(#cjGlow)" opacity="0.5"/>

  <!-- stars -->
  <g fill="#cdd6e4" opacity="0.5">
    <circle cx="120" cy="60" r="1.3"/><circle cx="300" cy="42" r="1"/><circle cx="470" cy="70" r="1.4"/>
    <circle cx="640" cy="38" r="1"/><circle cx="820" cy="66" r="1.3"/><circle cx="980" cy="44" r="1"/>
    <circle cx="1080" cy="80" r="1.2"/><circle cx="210" cy="110" r="0.9"/><circle cx="720" cy="112" r="0.9"/>
    <circle cx="1130" cy="120" r="1"/><circle cx="380" cy="120" r="0.8"/><circle cx="560" cy="118" r="0.8"/>
  </g>

  <!-- distant hills -->
  <path d="M0 240 Q200 200 420 232 T860 224 T1200 232 V300 H0 Z" fill="#152437"/>
  <path d="M0 262 Q260 236 520 258 T1040 250 T1200 258 V310 H0 Z" fill="#111e2f"/>

  <!-- three converging roadways meeting at the interchange horizon (vanishing ~600,250) -->
  <path d="M120 480 L560 258 L640 258 L500 480 Z" fill="url(#cjRoad)"/>
  <path d="M540 480 L590 258 L650 258 L700 480 Z" fill="url(#cjRoad)"/>
  <path d="M760 480 L600 258 L680 258 L1080 480 Z" fill="url(#cjRoad)"/>

  <!-- lane dashes, brass, growing toward the viewer -->
  <g stroke="#e8a33d" stroke-linecap="round" opacity="0.9">
    <path d="M600 300 v14" stroke-width="2.4"/>
    <path d="M600 332 v20" stroke-width="3.2"/>
    <path d="M600 372 v28" stroke-width="4.2"/>
    <path d="M600 424 v40" stroke-width="5.4"/>
  </g>
  <g stroke="#e8a33d" stroke-linecap="round" opacity="0.55">
    <path d="M360 340 l-10 26" stroke-width="3"/>
    <path d="M300 400 l-14 40" stroke-width="4.2"/>
    <path d="M860 340 l12 26" stroke-width="3"/>
    <path d="M930 400 l16 40" stroke-width="4.2"/>
  </g>

  <!-- road edges -->
  <path d="M122 478 L559 260" stroke="#40566f" stroke-width="2"/>
  <path d="M1078 478 L681 260" stroke="#40566f" stroke-width="2"/>

  <!-- overhead freeway shields: 80 / 680 / 12 on a green gantry -->
  <g transform="translate(600 150)">
    <rect x="-2" y="0" width="4" height="70" fill="#3a5068"/>
    <rect x="-210" y="-52" width="420" height="52" rx="6" fill="#12261c" stroke="#3a5068" stroke-width="2"/>
    <!-- I-80 shield -->
    <g transform="translate(-140 -26)">
      <path d="M-24 -14 h48 a7 7 0 0 1 7 7 v6 a15 15 0 0 1 -30 12 a15 15 0 0 1 -30 -12 v-6 a7 7 0 0 1 7 -7z" fill="#1c2c40" stroke="#5a6580" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="20" fill="#e6ddcb">80</text>
    </g>
    <!-- I-680 shield -->
    <g transform="translate(0 -26)">
      <path d="M-28 -14 h56 a7 7 0 0 1 7 7 v6 a15 15 0 0 1 -35 12 a15 15 0 0 1 -35 -12 v-6 a7 7 0 0 1 7 -7z" fill="#1c2c40" stroke="#5a6580" stroke-width="2"/>
      <text x="0" y="8" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="18" fill="#e6ddcb">680</text>
    </g>
    <!-- Hwy 12 marker -->
    <g transform="translate(140 -26)">
      <rect x="-22" y="-15" width="44" height="30" rx="4" fill="#e8a33d"/>
      <text x="0" y="7" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="18" fill="#201404">12</text>
    </g>
  </g>

  <!-- stalled car on the right shoulder, hazards blinking -->
  <g transform="translate(905 372)">
    <ellipse cx="0" cy="34" rx="72" ry="12" fill="#000" opacity="0.28"/>
    <path d="M-62 8 L-44 -20 L34 -24 L60 6 L66 8 L66 22 L-62 22 Z" fill="#31394b" stroke="#454e63" stroke-width="2.5"/>
    <path d="M-38 -14 L28 -18 L48 6 L-40 6 Z" fill="#0f1420"/>
    <circle cx="-38" cy="24" r="13" fill="#0e1119" stroke="#5a6580" stroke-width="4"/>
    <circle cx="40" cy="24" r="13" fill="#0e1119" stroke="#5a6580" stroke-width="4"/>
    <!-- hazard lamps -->
    <rect x="-66" y="0" width="8" height="9" rx="2" fill="#ff8a3d">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="60" y="0" width="8" height="9" rx="2" fill="#ff8a3d">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <ellipse cx="-62" cy="4" rx="26" ry="10" fill="#ff8a3d" opacity="0.16">
      <animate attributeName="opacity" values="0.22;0.04;0.22" dur="1s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- caption -->
  <text x="600" y="456" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="15" letter-spacing="2" fill="#7d8494">CORDELIA JUNCTION · I-80 / I-680 / HWY 12</text>
</svg>
