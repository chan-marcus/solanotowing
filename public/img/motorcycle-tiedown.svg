<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Diagram showing correct motorcycle tie-down: front wheel locked in a chock, soft-loop straps at the lower triple clamp and the frame, suspension compressed only part way, and never strapping by the handlebars or over painted bodywork">
  <rect width="720" height="300" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">How a bike should be strapped down</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Worth checking before the flatbed pulls away</text>

  <g font-family="Arial, sans-serif">
    <!-- correct -->
    <rect x="30" y="86" width="316" height="186" rx="14" fill="#17263a" stroke="#56d364" stroke-opacity="0.5"/>
    <circle cx="56" cy="116" r="9" fill="#56d364" fill-opacity="0.18" stroke="#56d364"/>
    <path d="M51.5 116 l3.2 3.4 l6-6.6" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="121" font-size="14.5" fill="#f6f2ea" font-weight="bold">Right</text>
    <g font-size="13" fill="#dfe3ee">
      <text x="52" y="152">Front wheel locked in a chock</text>
      <text x="52" y="178">Soft loops at the lower triple clamp</text>
      <text x="52" y="204">A second pair at the frame or pegs</text>
      <text x="52" y="230">Suspension compressed part way</text>
      <text x="52" y="256">Bike stands upright on its own</text>
    </g>

    <!-- wrong -->
    <rect x="374" y="86" width="316" height="186" rx="14" fill="#17263a" stroke="#f0705a" stroke-opacity="0.55"/>
    <circle cx="400" cy="116" r="9" fill="#f0705a" fill-opacity="0.18" stroke="#f0705a"/>
    <path d="M396.5 112.5 l7 7 M403.5 112.5 l-7 7" stroke="#f0705a" stroke-width="2" stroke-linecap="round"/>
    <text x="420" y="121" font-size="14.5" fill="#f6f2ea" font-weight="bold">Wrong</text>
    <g font-size="13" fill="#dfe3ee">
      <text x="396" y="152">Strapped by the handlebars alone</text>
      <text x="396" y="178">Hard hooks on painted bodywork</text>
      <text x="396" y="204">Cranked down until forks bottom out</text>
      <text x="396" y="230">Leaning on the sidestand in transit</text>
      <text x="396" y="256">Towed behind a wheel-lift</text>
    </g>
  </g>
</svg>
