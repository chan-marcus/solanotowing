<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="An itemized towing receipt showing a hook fee plus mileage adding up to one firm price">
  <defs>
    <linearGradient id="tcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16273c"/>
      <stop offset="0.58" stop-color="#132033"/>
      <stop offset="1" stop-color="#0d1826"/>
    </linearGradient>
    <linearGradient id="tcGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a33d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tcPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f2ea"/>
      <stop offset="1" stop-color="#e9e2d3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="480" rx="20" fill="url(#tcSky)"/>
  <ellipse cx="600" cy="240" rx="540" ry="150" fill="url(#tcGlow)" opacity="0.45"/>

  <!-- stars -->
  <g fill="#cdd6e4" opacity="0.5">
    <circle cx="140" cy="66" r="1.3"/><circle cx="320" cy="44" r="1"/><circle cx="900" cy="58" r="1.3"/>
    <circle cx="1040" cy="42" r="1"/><circle cx="1120" cy="92" r="1.2"/><circle cx="230" cy="120" r="0.9"/>
    <circle cx="1000" cy="130" r="1"/><circle cx="140" cy="180" r="0.9"/>
  </g>

  <!-- faint road horizon -->
  <path d="M0 372 Q300 350 600 366 T1200 360 V430 H0 Z" fill="#152437" opacity="0.8"/>
  <g stroke="#e8a33d" stroke-width="4" stroke-linecap="round" opacity="0.45" stroke-dasharray="26 34">
    <line x1="0" y1="402" x2="1200" y2="402"/>
  </g>

  <!-- receipt card -->
  <g transform="translate(340 66)">
    <rect x="6" y="10" width="360" height="360" rx="12" fill="#000" opacity="0.30"/>
    <path d="M0 8 L360 8 L360 356 L340 346 L320 356 L300 346 L280 356 L260 346 L240 356 L220 346 L200 356 L180 346 L160 356 L140 346 L120 356 L100 346 L80 356 L60 346 L40 356 L20 346 L0 356 Z" fill="url(#tcPaper)"/>

    <!-- header -->
    <text x="30" y="52" font-family="Archivo, sans-serif" font-weight="800" font-size="22" fill="#17263a" letter-spacing="-0.5">SOLANO TOWING</text>
    <text x="30" y="74" font-family="'Courier New', monospace" font-size="13" fill="#64748b">FAIRFIELD · SOLANO COUNTY, CA</text>
    <line x1="30" y1="92" x2="330" y2="92" stroke="#c9c0ad" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- line items -->
    <g font-family="'Courier New', monospace" font-size="16" fill="#2a3446">
      <text x="30" y="128">Hook fee</text>
      <text x="330" y="128" text-anchor="end" fill="#17263a" font-weight="700">$95.00</text>

      <text x="30" y="162">Mileage</text>
      <text x="150" y="162" font-size="12" fill="#8a8064">8 mi @ $5</text>
      <text x="330" y="162" text-anchor="end" fill="#17263a" font-weight="700">$40.00</text>

      <text x="30" y="196">After-hours</text>
      <text x="330" y="196" text-anchor="end" fill="#1c7a2b" font-weight="700">$0.00</text>
    </g>
    <line x1="30" y1="220" x2="330" y2="220" stroke="#c9c0ad" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- total -->
    <text x="30" y="262" font-family="Archivo, sans-serif" font-weight="800" font-size="20" fill="#17263a">TOTAL</text>
    <text x="330" y="262" text-anchor="end" font-family="Archivo, sans-serif" font-weight="800" font-size="26" fill="#c9832a">$135.00</text>

    <!-- stamp -->
    <g transform="translate(250 300) rotate(-8)">
      <rect x="-84" y="-24" width="168" height="48" rx="6" fill="none" stroke="#1c7a2b" stroke-width="3"/>
      <text x="0" y="7" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="17" fill="#1c7a2b" letter-spacing="0.5">QUOTED UP FRONT</text>
    </g>
    <text x="30" y="316" font-family="'Courier New', monospace" font-size="12" fill="#64748b">Same price on the phone as at drop-off</text>
  </g>

  <!-- brass tow hook, right side -->
  <g transform="translate(830 120)" stroke="#e8a33d" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <line x1="0" y1="-4" x2="0" y2="120"/>
    <path d="M0 120 q-2 44 -40 44 q-42 0 -42 -46 q0 -30 26 -34"/>
  </g>
  <circle cx="830" cy="118" r="8" fill="#e8a33d" opacity="0.92"/>

  <!-- coins / value dots -->
  <g transform="translate(792 300)">
    <ellipse cx="0" cy="60" rx="66" ry="14" fill="#000" opacity="0.25"/>
    <g fill="#e8a33d" stroke="#c9832a" stroke-width="2">
      <ellipse cx="-30" cy="44" rx="30" ry="11"/>
      <ellipse cx="-30" cy="36" rx="30" ry="11"/>
      <ellipse cx="24" cy="50" rx="30" ry="11"/>
      <ellipse cx="24" cy="42" rx="30" ry="11"/>
      <ellipse cx="24" cy="34" rx="30" ry="11"/>
    </g>
    <text x="24" y="38" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="13" fill="#201404">$</text>
    <text x="-30" y="40" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="13" fill="#201404">$</text>
  </g>

  <text x="600" y="462" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" font-size="15" letter-spacing="2" fill="#7d8494">HOOK FEE + MILEAGE = ONE FIRM PRICE</text>
</svg>
