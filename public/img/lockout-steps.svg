<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="What to do when your keys are locked in the car: first check every door and the hatch, your phone app, and your spare key; call 911 first if a child or pet is inside or the engine is running; a technician opens the door with a wedge and a long reach tool and will ask for proof the car is yours">
  <rect width="720" height="320" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">Keys locked inside: the next twenty minutes</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Two of these three columns cost nothing at all</text>
  <g font-family="Arial, sans-serif">
    <rect x="26" y="86" width="212" height="208" rx="14" fill="#17263a" stroke="#56d364" stroke-opacity="0.5"/>
    <circle cx="52" cy="114" r="9" fill="#56d364" fill-opacity="0.18" stroke="#56d364"/>
    <path d="M47.5 114 l3.2 3.4 l6-6.6" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="119" font-size="14.5" fill="#f6f2ea" font-weight="bold">Try first, free</text>
    <g font-size="12.5" fill="#dfe3ee">
      <text x="48" y="150">Every door, trunk, hatch</text>
      <text x="48" y="176">The maker&#8217;s phone app</text>
      <text x="48" y="202">Spare key, and who has it</text>
      <text x="48" y="228">Blade key hidden in the fob</text>
      <text x="48" y="254">Keyhole under the handle cover</text>
    </g>

    <rect x="254" y="86" width="212" height="208" rx="14" fill="#17263a" stroke="#f0705a" stroke-opacity="0.55"/>
    <circle cx="280" cy="114" r="9" fill="#f0705a" fill-opacity="0.18" stroke="#f0705a"/>
    <path d="M280 108.5 v6.5 M280 119 v0.5" stroke="#f0705a" stroke-width="2" stroke-linecap="round"/>
    <text x="300" y="119" font-size="14.5" fill="#f6f2ea" font-weight="bold">Call 911 first if</text>
    <g font-size="12.5" fill="#dfe3ee">
      <text x="276" y="150">A child is inside</text>
      <text x="276" y="176">A pet is inside</text>
      <text x="276" y="202">The engine is running</text>
      <text x="276" y="228">It is hot, or the sun is on it</text>
    </g>
    <text x="276" y="262" font-size="11.5" fill="#e8a33d">A window is worth less than a wait</text>

    <rect x="482" y="86" width="212" height="208" rx="14" fill="#17263a" stroke="#e8a33d" stroke-opacity="0.5"/>
    <circle cx="508" cy="114" r="9" fill="#e8a33d" fill-opacity="0.18" stroke="#e8a33d"/>
    <path d="M504 114 h8 M508 110 v8" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
    <text x="528" y="119" font-size="14.5" fill="#f6f2ea" font-weight="bold">What a tech does</text>
    <g font-size="12.5" fill="#dfe3ee">
      <text x="504" y="150">Air wedge at the door corner</text>
      <text x="504" y="176">Long reach tool, not a hanger</text>
      <text x="504" y="202">Works the handle or lock button</text>
      <text x="504" y="228">Asks for proof the car is yours</text>
      <text x="504" y="254">Flat fee, quoted on the phone</text>
    </g>
  </g>
  <text x="360" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">A coat hanger reaches the airbag wiring, the window motor and the weather seal before it reaches the lock</text>
</svg>
