<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Comparison of what roadside assistance fixes on the spot — flat tire, dead battery, empty tank, keys locked in the car — versus what needs a tow: no spare, shredded tire, engine that will not start after a jump, overheating, collision damage, and a car stuck off the pavement">
  <rect width="720" height="330" rx="18" fill="#0f1722"/>
  <text x="360" y="40" text-anchor="middle" font-family="Georgia, serif" font-size="21" fill="#f6f2ea">Roadside fix, or does it need a tow?</text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8">Most Fairfield calls land on the left. The right side is when the truck hooks up.</text>

  <g font-family="Arial, sans-serif">
    <!-- Left: fixed on the spot -->
    <rect x="30" y="86" width="316" height="216" rx="14" fill="#17263a" stroke="#56d364" stroke-opacity="0.5"/>
    <circle cx="56" cy="116" r="9" fill="#56d364" fill-opacity="0.18" stroke="#56d364"/>
    <path d="M51.5 116 l3.2 3.4 l6-6.6" fill="none" stroke="#56d364" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="121" font-size="14.5" fill="#f6f2ea" font-weight="bold">Fixed where you are</text>
    <text x="76" y="140" font-size="11.5" fill="#94a3b8">Flat call-out fee, no hook</text>

    <g font-size="13" fill="#dfe3ee">
      <text x="52" y="172">Flat tire, and you have a spare</text>
      <text x="52" y="198">Dead battery that takes a jump</text>
      <text x="52" y="224">Out of gas or diesel</text>
      <text x="52" y="250">Keys locked in the car</text>
      <text x="52" y="276">Loose or corroded battery terminal</text>
    </g>

    <!-- Right: needs a tow -->
    <rect x="374" y="86" width="316" height="216" rx="14" fill="#17263a" stroke="#e8a33d" stroke-opacity="0.6"/>
    <circle cx="400" cy="116" r="9" fill="#e8a33d" fill-opacity="0.18" stroke="#e8a33d"/>
    <path d="M400 111.5 v5.5 M400 120.5 v0.6" stroke="#e8a33d" stroke-width="2" stroke-linecap="round"/>
    <text x="420" y="121" font-size="14.5" fill="#f6f2ea" font-weight="bold">Needs the truck</text>
    <text x="420" y="140" font-size="11.5" fill="#94a3b8">Hook fee plus mileage, quoted first</text>

    <g font-size="13" fill="#dfe3ee">
      <text x="396" y="172">No spare, or the tire is shredded</text>
      <text x="396" y="198">Won&#8217;t stay running after a jump</text>
      <text x="396" y="224">Overheated, or a coolant leak</text>
      <text x="396" y="250">Collision damage, won&#8217;t roll or steer</text>
      <text x="396" y="276">Off the pavement — needs a winch</text>
    </g>
  </g>
</svg>
